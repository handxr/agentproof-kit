name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # The runner has no agent CLIs, so the smoke test only checks that the example project generates.
      - run: npm run smoke
      # Forks publish the CLI. This step builds dist/ and lists the package contents.
      - run: npm pack --dry-run
